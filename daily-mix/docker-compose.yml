version: "3"

services:
  daily-mix:
    build: .
    container_name: daily-mix
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5050:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - music-stack

networks:
  music-stack:
    external: true
