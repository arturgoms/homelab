version: "3"

services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config:/config
      - /mnt/friday-pool/all/media/music:/music
      - /mnt/friday-pool/all/downloads:/downloads
    ports:
      - 8686:8686
    networks:
      - music-stack

networks:
  music-stack:
    external: true
